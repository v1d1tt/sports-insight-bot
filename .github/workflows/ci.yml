# CI: checks every push and every pull request.
# One job runs the API checks (ruff, pytest), then the web page checks
# (svelte-check, Vitest, Playwright). Branch protection on main requires
# this job ("Lint and test") to pass before a pull request can merge.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # API (backend/): Python, managed with uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          enable-cache: true

      - name: Install API packages
        working-directory: backend
        run: uv sync --locked

      - name: Lint the API (ruff)
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test the API (pytest)
        working-directory: backend
        run: uv run pytest

      # Web page (frontend/): Svelte + Vite, managed with npm
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web packages
        working-directory: frontend
        run: npm ci

      - name: Type-check the web page (svelte-check)
        working-directory: frontend
        run: npm run check

      - name: Test components (Vitest)
        working-directory: frontend
        run: npm test

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test the page in a browser (Playwright)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright traces when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
